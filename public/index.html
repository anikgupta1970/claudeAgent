<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banking Journey Builder — API Banking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header — matches fd-components Header + Logo */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background-color: #ffffff;
      border-bottom: 1px solid #CED4DA;
      width: 100%;
      box-sizing: border-box;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }
    header .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    header .logo-container:hover { opacity: 0.8; }
    header .logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      width: 40px;
      flex-shrink: 0;
    }
    header .logo-text { display: flex; flex-direction: column; justify-content: center; }
    header .logo-name {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 18px;
      line-height: 1.3;
      color: #1D2329;
      white-space: nowrap;
    }
    header .logo-slogan {
      font-family: 'Poppins', sans-serif;
      font-weight: 400;
      font-size: 14px;
      color: #6C757D;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    @media (max-width: 480px) {
      header { padding: 8px 16px; }
    }

    /* Chat area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome {
      text-align: center;
      margin: auto;
      max-width: 480px;
      padding: 32px 24px;
    }
    .welcome h2 {
      font-size: 20px;
      color: #1a3a5c;
      margin-bottom: 8px;
    }
    .welcome p {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .suggestions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .suggestion {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #374151;
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, background .15s;
    }
    .suggestion:hover {
      border-color: #1a3a5c;
      background: #f8fafc;
    }

    /* Messages */
    .message {
      display: flex;
      gap: 10px;
      max-width: 780px;
      width: 100%;
    }
    .message.user { margin-left: auto; flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .message.user .avatar { background: #e85555; color: #fff; }
    .message.assistant .avatar { background: #1a3a5c; color: #fff; }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      max-width: calc(100% - 44px);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user .bubble {
      background: #e85555;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.assistant .bubble {
      background: #fff;
      color: #111827;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    /* Code blocks inside assistant messages */
    .bubble pre {
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
      overflow-x: auto;
      font-size: 12.5px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      line-height: 1.5;
    }
    .bubble code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12.5px;
      background: #f1f5f9;
      color: #1a3a5c;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .bubble pre code { background: none; color: inherit; padding: 0; }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }
    .dot {
      width: 7px; height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input bar */
    footer {
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 12px 16px;
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 8px;
      max-width: 780px;
      margin: 0 auto;
    }
    textarea {
      flex: 1;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.5;
      max-height: 140px;
      overflow-y: auto;
      transition: border-color .15s;
    }
    textarea:focus { border-color: #1a3a5c; }
    textarea::placeholder { color: #9ca3af; }

    button#send {
      background: #e85555;
      color: #fff;
      border: none;
      border-radius: 10px;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background .15s, opacity .15s;
      align-self: flex-end;
    }
    button#send:hover { background: #d14444; }
    button#send:disabled { opacity: .45; cursor: not-allowed; }
    button#send svg { width: 18px; height: 18px; }

    .hint {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      margin-top: 6px;
    }

    @media (max-width: 600px) {
      .bubble { font-size: 13px; }
    }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo-container">
    <div class="logo-icon">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="40" height="40">
        <defs>
          <linearGradient id="logo-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#E30613" />
            <stop offset="1" stop-color="#0072C6" />
          </linearGradient>
        </defs>
        <path d="M20 0L27.0711 7.07107L34.1421 14.1421L40 20L34.1421 25.8579L27.0711 32.9289L20 40L12.9289 32.9289L5.85786 25.8579L0 20L5.85786 14.1421L12.9289 7.07107L20 0Z" fill="url(#logo-gradient)" />
        <path d="M20 7.5L24.6944 12.1944L29.3889 16.8889L32.5 20L29.3889 23.1111L24.6944 27.8056L20 32.5L15.3056 27.8056L10.6111 23.1111L7.5 20L10.6111 16.8889L15.3056 12.1944L20 7.5Z" fill="#F7F8FA" />
      </svg>
    </div>
    <div class="logo-text">
      <span class="logo-name">API Banking</span>
      <span class="logo-slogan">Banking Journey Builder</span>
    </div>
  </a>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <h2>Banking Journey Builder</h2>
    <p>I can build complete banking onboarding journeys and generate correct Stitch API payloads. Try one of these to get started:</p>
    <div class="suggestions">
      <button class="suggestion" onclick="send('Build an Open FD journey for an existing customer')">Build an Open FD journey for an existing customer</button>
      <button class="suggestion" onclick="send('Generate a Stitch form payload to open a fixed deposit')">Generate a Stitch form payload to open a fixed deposit</button>
      <button class="suggestion" onclick="send('What instruction types are available in Stitch?')">What instruction types are available in Stitch?</button>
    </div>
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea
      id="input"
      rows="1"
      placeholder="Ask me to build a banking journey…"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button id="send" onclick="sendFromInput()" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <p class="hint">Press Enter to send · Shift+Enter for new line</p>
</footer>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  let busy = false;

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFromInput(); }
  }

  function sendFromInput() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = '';
    input.style.height = 'auto';
    send(text);
  }

  async function send(text) {
    if (busy) return;
    busy = true;
    sendBtn.disabled = true;

    document.getElementById('welcome')?.remove();

    appendMessage('user', text);
    const typingEl = appendTyping();
    scrollBottom();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: text }),
      });
      const data = await res.json();
      typingEl.remove();
      appendMessage('assistant', data.error ? `Error: ${data.error}` : data.text);
    } catch (err) {
      typingEl.remove();
      appendMessage('assistant', 'Something went wrong. Please try again.');
    }

    scrollBottom();
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }

  function appendMessage(role, text) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    const initial = role === 'user' ? 'You' : 'AI';
    div.innerHTML = `
      <div class="avatar">${initial}</div>
      <div class="bubble">${formatText(text)}</div>
    `;
    chat.appendChild(div);
  }

  function appendTyping() {
    const div = document.createElement('div');
    div.className = 'message assistant typing';
    div.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    `;
    chat.appendChild(div);
    return div;
  }

  function formatText(text) {
    // Escape HTML first
    let s = text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // Fenced code blocks
    s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${code.trimEnd()}</code></pre>`);

    // Inline code
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Bold
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // Line breaks (outside pre blocks — simple approach)
    s = s.replace(/\n/g, '<br>');

    return s;
  }

  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  input.focus();
</script>
</body>
</html>
